schema_version: "1.1"
name: query-report-traps
tags: [sql, postgres]
# refs is a symlink to the plugin's references/, so the skill can read them.
# query-check/ is run by scripts/pre-commit-evals.sh after the eval: it builds
# the database from schema.apsorc, loads seed.sql (rows chosen so common SQL
# mistakes return wrong answers) and compares each query file's rows.
context:
  add_dirs: [refs]
execution:
  prompt_file: prompt.md
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
graders: []
