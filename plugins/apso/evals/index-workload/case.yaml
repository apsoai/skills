schema_version: "1.1"
name: index-workload
tags: [indexes, postgres]
# refs is a symlink to the plugin's references/, so the skill can read them.
# index-check/ is run by scripts/pre-commit-evals.sh after the eval: it builds
# the database from the agent's .apsorc and checks each query in
# queries.json has an index that serves it, and that no index is wasted.
context:
  add_dirs: [refs]
execution:
  prompt_file: prompt.md
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
graders: []
